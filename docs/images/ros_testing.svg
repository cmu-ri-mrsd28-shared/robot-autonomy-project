<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" xmlns:c2pa="http://c2pa.org/manifest"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.plain{fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style><rect width="680" height="340" fill="#FFFFFF"/><title>Catchbox ROS pipeline with mocks</title><desc>mock_inputs publishes synthetic ball state to model_node, which publishes opening targets to the adapter running with --mock-robot. The adapter's joint_target topic drives mock_robot, which publishes robot joints back to the adapter and box state to the model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal">
<rect x="20" y="60" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="80" y="79" text-anchor="middle" dominant-baseline="central">mock_inputs.py</text>
<text class="ts" x="80" y="98" text-anchor="middle" dominant-baseline="central">synthetic throw</text>
</g>
<g class="c-purple">
<rect x="225" y="60" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="295" y="79" text-anchor="middle" dominant-baseline="central">model_node.py</text>
<text class="ts" x="295" y="98" text-anchor="middle" dominant-baseline="central">PolicyFrame + actor</text>
</g>
<g class="c-purple">
<rect x="470" y="60" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="79" text-anchor="middle" dominant-baseline="central">adapter.py</text>
<text class="ts" x="555" y="98" text-anchor="middle" dominant-baseline="central">--mock-robot, no motion</text>
</g>
<g class="c-teal">
<rect x="460" y="220" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="239" text-anchor="middle" dominant-baseline="central">mock_robot.py</text>
<text class="ts" x="550" y="258" text-anchor="middle" dominant-baseline="central">follows commands instantly</text>
</g>
<line x1="140" y1="88" x2="223" y2="88" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="182" y="76" text-anchor="middle">ball_state</text>
<text class="ts" x="182" y="106" text-anchor="middle">ball_in_box</text>
<line x1="365" y1="88" x2="468" y2="88" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="417" y="76" text-anchor="middle">opening_target</text>
<line x1="520" y1="116" x2="520" y2="218" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="512" y="168" text-anchor="end">joint_target</text>
<line x1="600" y1="218" x2="600" y2="118" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="608" y="168">robot_</text>
<text class="ts" x="608" y="184">joints</text>
<path d="M458 248 H295 V118" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="380" y="238" text-anchor="middle">box_state</text>
<rect class="c-purple" x="40" y="310" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="321">same code as on the robot</text>
<rect class="c-teal" x="250" y="310" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="272" y="321">mock stand-ins</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
