<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" xmlns:c2pa="http://c2pa.org/manifest"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.plain{fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style><rect width="680" height="410" fill="#FFFFFF"/><title>Catchbox ROS pipeline on the robot</title><desc>A future ball tracker publishes ball state to model_node, which publishes opening targets to the adapter; send_target can also publish test targets. The adapter streams joint targets to franka-interface on the Control PC. robot_state reads the robot through FrankaPy and publishes robot joints to the adapter and box state to the model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple">
<rect x="475" y="40" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="59" text-anchor="middle" dominant-baseline="central">send_target.py</text>
<text class="ts" x="550" y="78" text-anchor="middle" dominant-baseline="central">manual test targets</text>
</g>
<rect x="20" y="150" width="120" height="56" rx="8" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text class="th plain" x="80" y="169" text-anchor="middle" dominant-baseline="central">Ball tracker</text>
<text class="ts" x="80" y="188" text-anchor="middle" dominant-baseline="central">not built yet</text>
<g class="c-purple">
<rect x="210" y="150" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="285" y="169" text-anchor="middle" dominant-baseline="central">model_node.py</text>
<text class="ts" x="285" y="188" text-anchor="middle" dominant-baseline="central">PolicyFrame + actor</text>
</g>
<g class="c-purple">
<rect x="460" y="150" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="169" text-anchor="middle" dominant-baseline="central">adapter.py</text>
<text class="ts" x="550" y="188" text-anchor="middle" dominant-baseline="central">IK + limiter, 100 Hz</text>
</g>
<g class="c-purple">
<rect x="210" y="300" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="285" y="319" text-anchor="middle" dominant-baseline="central">robot_state.py</text>
<text class="ts" x="285" y="338" text-anchor="middle" dominant-baseline="central">FK at 50 Hz</text>
</g>
<g class="c-gray">
<rect x="460" y="300" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="319" text-anchor="middle" dominant-baseline="central">franka-interface</text>
<text class="ts" x="550" y="338" text-anchor="middle" dominant-baseline="central">Control PC + Panda</text>
</g>
<line x1="550" y1="96" x2="550" y2="148" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="140" y1="178" x2="208" y2="178" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="175" y="166" text-anchor="middle">ball_state</text>
<text class="ts" x="175" y="196" text-anchor="middle">ball_in_box</text>
<line x1="360" y1="178" x2="458" y2="178" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="410" y="166" text-anchor="middle">opening_target</text>
<line x1="550" y1="206" x2="550" y2="298" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="558" y="256">joint targets</text>
<line x1="458" y1="328" x2="362" y2="328" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="410" y="318" text-anchor="middle">FrankaPy</text>
<line x1="285" y1="298" x2="285" y2="208" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="277" y="256" text-anchor="end">box_state</text>
<path d="M340 298 V250 H500 V208" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="420" y="242" text-anchor="middle">robot_joints</text>
<rect class="c-purple" x="40" y="384" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="395">this repo</text>
<rect class="c-gray" x="150" y="384" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="172" y="395">FrankaPy / robot</text>
<line x1="300" y1="391" x2="340" y2="391" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
